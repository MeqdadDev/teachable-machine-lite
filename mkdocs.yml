site_name: Teachable Machine Lite Package - Documentation
site_url: https://meqdaddev.github.io/teachable-machine-lite/
repo_url: https://github.com/MeqdadDev/teachable-machine-lite

theme:
  name: "readthedocs"

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              returns_named_value: false

nav:
  - Teachable Machine Lite - Home: index.md
  - How-To Guide: how-to-guide.md
  - Requirements: requirements.md
  - Code Examples: codeExamples.md
  - Explanation: explanation.md
  - Changelog: changelog.md
  - Contributing: contribution.md
  - Releasing: releasing.md

docs_dir: source_docs
