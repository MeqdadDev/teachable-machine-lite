name: Deploy Docs

# Builds the mkdocs site from source_docs/ and deploys it to GitHub Pages.
#
# One-time setup: in Settings -> Pages -> "Build and deployment" -> Source, switch
# from "Deploy from a branch" (the hand-built `docs` branch) to "GitHub Actions".
# Until then this workflow builds the site but the deploy job fails.
on:
  push:
    branches: [main]
    paths:
      - "source_docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs "mkdocstrings[python]"

      - name: Build site
        run: python -m mkdocs build --strict --site-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
